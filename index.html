
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        body{
            margin-top: 20px;

        }
        h3{
            text-align: center;
        }
    </style>
</head>
<body>
      <h3>javascript Assignment - mini calculator</h3>
    
    
    
    
    <script>
        let num_1=Number(prompt('Enter first number :'));
        let op=prompt("Enter operator to perform operation such as + - * /")
        let num_2=Number(prompt('Enter second number :'));
        if(isNaN(num_1) || isNaN(num_2)){
                alert('kindly enter number in numeric type');
        }else{
            if(op==='+'){
                alert(`sum of ${num_1} and ${num_2} is ${num_1+num_2}`);
                console.log(`sum of ${num_1} and ${num_2} is ${num_1+num_2}`);
            }else if(op==='-'){
                alert(`Diffference of ${num_1} and ${num_2} is ${num_1-num_2}`);
                console.log(`Diffference of ${num_1} and ${num_2} is ${num_1-num_2}`);
            }else if(op==='*'){
                alert(`Product  of ${num_1} and ${num_2} is ${num_1*num_2}`);
                console.log(`Product  of ${num_1} and ${num_2} is ${num_1*num_2}`)
            }else if(op==='/'){
                if(num_1===0){
                    alert(`${num_1} divided ${num_2} is Not Defined`);
                    console.log(`${num_1} divided ${num_2} is Not Defined`);
                }else{
                    alert(`Division of ${num_1} and ${num_2} is ${num_1/num_2}`);
                    console.log(`Division of ${num_1} and ${num_2} is ${num_1/num_2}`);
                }
            }else{
                alert("you've entered invalid operator");
            };
        };

    </script>
</body>

</html>
